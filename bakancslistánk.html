<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakancslistánk</title>

    <style>
        body {
            margin: 0;
             background: radial-gradient(circle at top, #0b2a4a, #000);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            text-align: center;
            margin: 20px 0;
        }

        .keptar {
            width: 90%;
            max-width: 1200px;
        }

.keptar img {
    width: 70%;          /* kisebb lesz */
    max-width: 900px;    /* felső korlát nagy kijelzőn */
    height: auto;        /* arány megtartása */
    display: block;
    margin: 0 auto 20px auto;
    border-radius: 8px;
}
               /* ❌ BEZÁRÓ X */
.close-btn {
    position: fixed;
    top: 14px;
    right: 16px;
    color: white;
    text-decoration: none;
    font-size: 26px;
    font-weight: 600;
    z-index: 1000;
    opacity: 0.85;
}

.close-btn:hover {
    opacity: 1;
}
.kep-tarolo {
    width: 100%;
    display: flex;
    justify-content: center;
}

.kep-tarolo img {
    width: 70%;          /* 👉 EZ teszi kisebbé */
    max-width: 600px;    /* 👉 felső korlát asztali nézeten */
    aspect-ratio: 50 / 15;
    height: auto;
    display: block;
}


/* MOBIL */
@media (max-width: 768px) {
    .close-btn {
        font-size: 28px;
        top: 12px;
        right: 14px;
    }

    .keptar img {
        width: 95%;        /* mobilon majdnem teljes szélesség */
        max-width: none;   /* ne korlátozza */
        border-radius: 10px;
    }
}

    </style>
</head>
<body>
<br>
<a href="fooldal.html" class="close-btn">✕</a>

</html>
