<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
}

body {
     background: radial-gradient(circle at top, #0b2a4a, #000);
    color: #fff;
    font-family: 'Montserrat', sans-serif;

    overflow-y: auto;    /* ✅ görgethető */
    overflow-x: hidden; /* ❌ oldalirány nincs */
}


/* ======================
   ALAP
   ====================== */
.wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 10px 12px;
}

/* ======================
   💻 LAPTOP
   ====================== */
@media (min-width: 769px) {

    .wrapper {
        max-width: 50cm;
        min-height: 25cm;
        margin: 0 auto;
    }

    /* KÉPEK KISEBBEK, ARÁNYTARTÓK */
    .slider {
        max-width: 85%;
        margin: 0 auto;
    }

    .slide img {
        width: 100%;
        max-height: 380px;
        object-fit: contain;
    }

    /* UTOLSÓ KÉT GOMB ÚJ SORBAN, AZONOS MÉRET */
    .buttons {
        justify-content: center;
    }

    .buttons a:nth-last-child(-n+2) {
        flex: 0 0 auto;
    }
}

/* ======================
   FEJLÉC
   ====================== */
.header {
    text-align: center;
}

.header h1 {
    font-size: 22px;
    letter-spacing: 2px;
    margin: 4px 0;
}

.quote {
    font-family: 'Playfair Display', serif;
    font-size: 13px;
    color: #cfd8e3;
    margin: 2px 0;
}

.family-title {
    font-family: 'Cinzel', serif;
    font-size: 18px;
    letter-spacing: 3px;
    margin: 2px 0 6px 0;
}

/* ======================
   SLIDER
   ====================== */
.slider {
    width: 100%;
    overflow: hidden;
    border-radius: 14px;
}

.slide {
    display: none;
}

.slide.active {
    display: block;
}

.slide a {
    display: block;
}

.slide img {
    width: 100%;
    display: block;
    object-fit: contain;
}

/* ======================
   DOTS
   ====================== */
.dots {
    margin: 6px 0;
    text-align: center;
}

.dot {
    width: 10px;
    height: 10px;
    margin: 0 3px;
    background: #555;
    border-radius: 50%;
    display: inline-block;
}

.dot.active {
    background: white;
}

/* ======================
   GOMBOK
   ====================== */
.buttons {
    display: flex;
    gap: 8px;
    margin-top: 6px;
    flex-wrap: wrap;
    justify-content: center;
    min-width: 150px;
}

.buttons a {
    background-color: #0b2a4a;
    color: white;
    text-decoration: none;
    padding: 12px 22px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    min-width: 160px;
    text-align: center;
}

/* SPEC GOMB SZÍNEK */
.buttons a:nth-last-child(2) {
    background-color: #ffd400;
    color: #003366;
    min-width: 140px;

}

.buttons a:last-child {
    background-color: #c62828;
    color: white;
    min-width: 140px;

}

/* ======================
   📱 MOBIL
   ====================== */
@media (max-width: 768px) {

    .wrapper {
        min-height: 100svh;
    }

    .header h1 {
        font-size: 32px;
        line-height: 1.2;
    }

    .quote {
        font-size: 17px;
        line-height: 1.4;
    }

    .family-title {
        font-size: 24px;
        letter-spacing: 4px;
        margin-bottom: 10px;
    }

    .slider {
        width: 95vw;
    }
}
.quote2 {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    color: yellow;
    background-color: black;
    border-radius: 3px;

    display: inline-block;
    padding: 5px 10px;

    margin-left: 5px;      /* laptop */
    margin-right: auto;
}

@media (max-width: 768px) {

    .buttons {
        display: grid;
        grid-template-columns: repeat(2, minmax(140px, 1fr));
        gap: 12px;

        justify-content: center;      /* rács középre */
        justify-items: center;        /* gombok középre */

        max-width: 340px;             /* teljes blokk középre */
        margin: 12px auto 0 auto;
    }

    .buttons a {
        width: 100%;
        min-width: unset;
        padding: 14px 12px;
        font-size: 14px;
    }
}

</style>

<script>
let index = 0;
const now = new Date();

// 🔹 1. MINDEN slide időintervallum ellenőrzése (nem csak kiemelt)
document.querySelectorAll(".slide").forEach(slide => {
    const start = slide.dataset.start;
    const end = slide.dataset.end;

    // csak akkor vizsgáljuk, ha VAN dátum megadva
    if (start && end) {
        const startDate = new Date(start);
        const endDate = new Date(end);

        // ha MÉG NEM kezdődött el, vagy MÁR LEJÁRT → törlés
        if (now < startDate || now > endDate) {
            slide.remove();
        }
    }
});

// 🔹 2. Megmaradt KIEMELT slide(ok) előre hozása
const slider = document.querySelector(".slider");
document.querySelectorAll(".slide.kiemelt").forEach(slide => {
    slider.prepend(slide);
});

// 🔹 3. DOTOK ÚJRAÉPÍTÉSE A MEGMARADT SLIDE-OK ALAPJÁN
const dotsKontener = document.querySelector(".dots");
dotsKontener.innerHTML = "";

const slides = document.querySelectorAll(".slide");

slides.forEach(() => {
    const dot = document.createElement("span");
    dot.classList.add("dot");
    dotsKontener.appendChild(dot);
});

const dots = document.querySelectorAll(".dot");

// 🔹 4. Slider működés (változatlan)
function showSlide(i) {
    slides.forEach(s => s.classList.remove("active"));
    dots.forEach(d => d.classList.remove("active"));

    index = (i + slides.length) % slides.length;
    slides[index].classList.add("active");
    dots[index].classList.add("active");
}

// indulás
if (slides.length > 0) {
    showSlide(0);

    // automatikus váltás
    setInterval(() => showSlide(index + 1), 5000);
}
</script>
