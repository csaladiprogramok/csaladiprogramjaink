    <style>
        /* ======================
   RESET + ALAP
   ====================== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            max-width: 100%;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
        }

        body {
            background: radial-gradient(circle at top, #0b2a4a, #000);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
        }

        /* ======================
   WRAPPER
   ====================== */
        .wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100svh;
            padding: 10px;
            width: 100%;
        }

        /* ======================
   FEJLÉC
   ====================== */
        .header {
            text-align: center;
            width: 100%;
        }

        .header h1 {
            font-size: clamp(18px, 5.5vw, 30px);
            line-height: 1.25;
            letter-spacing: 0.14em;
            margin: 6px 0;
        }

        .quote {
            font-family: 'Playfair Display', serif;
            font-size: clamp(13px, 4vw, 16px);
            color: #cfd8e3;
            margin: 4px 0;
        }

        .family-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(17px, 5.5vw, 24px);
            letter-spacing: 0.18em;
            margin: 4px 0 8px;
        }

        .quote2 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(12px, 3.8vw, 15px);
            color: yellow;
            background-color: black;
            border-radius: 6px;
            padding: 6px 12px;
            display: inline-block;
        }

        /* ======================
   SLIDER
   ====================== */
        .slider {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            border-radius: 14px;
            overflow: hidden;
        }

        .slide {
            display: none;
        }

        .slide.active {
            display: block;
        }

        .slide img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        /* ======================
   DOTS
   ====================== */
        .dots {
            margin: 6px 0;
            text-align: center;
            width: 100%;
        }

        .dot {
            width: 9px;
            height: 9px;
            margin: 0 3px;
            background: #555;
            border-radius: 50%;
            display: inline-block;
        }

        .dot.active {
            background: white;
        }

        /* ======================
   GOMBOK – MOBIL / TABLET (GRID)
   ====================== */
        .buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
            margin-top: 14px;
        }

        .buttons a {
            background-color: #0b2a4a;
            color: white;
            text-decoration: none;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 16px 10px;
            border-radius: 14px;

            font-size: clamp(11px, 3.6vw, 14px);
            font-weight: 600;
            text-align: center;
            line-height: 1.35;
        }

        /* Speciális gombszínek */
        .buttons a:nth-last-child(2) {
            background-color: #ffd400;
            color: #003366;
        }

        .buttons a:last-child {
            background-color: #c62828;
            color: white;
        }

        /* ======================
   📱 EXTRA KICSI MOBIL
   ====================== */
        @media (max-width: 360px) {
            .buttons a {
                padding: 14px 8px;
                font-size: 11px;
            }
        }

        /* ======================
   📱📱 TABLET
   ====================== */
        @media (min-width: 600px) and (max-width: 768px) {
            .buttons {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* ======================
   💻 LAPTOP – FLEXBOX (ALSÓ SOR KÖZÉPEN!)
   ====================== */
        @media (min-width: 769px) {

            .wrapper {
                max-width: 1200px;
                margin: 0 auto;
            }

            .slider {
                max-width: 800px;
                border-radius: 16px;
            }

            /* 🔥 EZ A MEGOLDÁS */
            .buttons {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                /* 👉 UTOLSÓ SOR IS KÖZÉPEN */
                gap: 12px;

                max-width: 1000px;
                margin: 14px auto 0;
            }

            .buttons a {
                width: 150px;
                /* fix szélesség */
                padding: 18px 10px;
                font-size: 14px;
            }
        }

        /* ======================
   GÉPELŐS ANIMÁCIÓ
   ====================== */
        .iro-animacio {
            display: inline-block;
        }

        .iro-animacio span {
            display: inline-block;
            overflow: hidden;
            white-space: nowrap;
            border-right: 2px solid black;
            font-family: monospace;
            width: 0;

            animation:
                gepeles 4s steps(30, end) infinite,
                kurzor 0.7s step-end infinite;
        }

        @keyframes gepeles {
            0% {
                width: 0;
            }

            50% {
                width: max-content;
            }

            100% {
                width: 0;
            }
        }

        @keyframes kurzor {
            50% {
                border-color: transparent;
            }
        }
    </style>

</head>

    <script>
        let index = 0;
        const now = new Date();

        // 🔹 1. MINDEN slide időintervallum ellenőrzése (nem csak kiemelt)
        document.querySelectorAll(".slide").forEach(slide => {
            const start = slide.dataset.start;
            const end = slide.dataset.end;

            // csak akkor vizsgáljuk, ha VAN dátum megadva
            if (start && end) {
                const startDate = new Date(start);
                const endDate = new Date(end);

                // ha MÉG NEM kezdődött el, vagy MÁR LEJÁRT → törlés
                if (now < startDate || now > endDate) {
                    slide.remove();
                }
            }
        });

        // 🔹 2. Megmaradt KIEMELT slide(ok) előre hozása
        const slider = document.querySelector(".slider");
        document.querySelectorAll(".slide.kiemelt").forEach(slide => {
            slider.prepend(slide);
        });

        // 🔹 3. DOTOK ÚJRAÉPÍTÉSE A MEGMARADT SLIDE-OK ALAPJÁN
        const dotsKontener = document.querySelector(".dots");
        dotsKontener.innerHTML = "";

        const slides = document.querySelectorAll(".slide");

        slides.forEach(() => {
            const dot = document.createElement("span");
            dot.classList.add("dot");
            dotsKontener.appendChild(dot);
        });

        const dots = document.querySelectorAll(".dot");

        // 🔹 4. Slider működés (változatlan)
        function showSlide(i) {
            slides.forEach(s => s.classList.remove("active"));
            dots.forEach(d => d.classList.remove("active"));

            index = (i + slides.length) % slides.length;
            slides[index].classList.add("active");
            dots[index].classList.add("active");
        }

        // indulás
        if (slides.length > 0) {
            showSlide(0);

            // automatikus váltás
            setInterval(() => showSlide(index + 1), 5000);
        }
    </script>
