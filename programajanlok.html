    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
             background: radial-gradient(circle at top, #0b2a4a, #000);
            padding: 20px;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: #fff;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 22px;
            letter-spacing: 1px;
        }

        .header h2 {
            font-size: 26px;
            margin-top: 5px;
        }

        .month {
            color: white;
            font-weight: bold;
            text-align: center;
            margin: 20px 0 10px;
            font-size: 18px;
        }

        .card {
            background: #fff;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            margin-bottom: 20px;
        }

        .card img {
            width: 100%;
            display: block;
        }

        .card-content {
            padding: 15px;
            color: #000;
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            color: #1db954;
            margin-bottom: 6px;
        }

        .card-location {
            font-size: 14px;
            font-style: italic;
            margin-bottom: 12px;
        }

        .card-button {
            display: inline-block;
            background: #1db954;
            color: #fff;
            padding: 10px 16px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
        }
        .card-button:hover {
            background: #17a84a;
        }

        .no-ticket {
            display: inline-block;
            background: grey;
            color: #fff;
            padding: 10px 16px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
        }

        .divider {
            text-align: center;
            color: red;
            font-weight: bold;
            margin: 10px 0 15px;
        }

        /* ÉVES PROGRAMAJÁNLÓ */
        .yearly-wrapper {
            text-align: center;
            margin: 40px 0 20px;
        }

        .yearly-button {
            display: inline-block;
            background: linear-gradient(135deg, #1e90ff, #4aa3ff);
            color: #fff;
            padding: 16px 30px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            box-shadow: 0 6px 18px rgba(0,0,0,0.5);
        }

        .yearly-button:hover {
            background: linear-gradient(135deg, #187bcd, #3a8dde);
        }

        .yearly-text {
            color: #fff;
            font-size: 13px;
            margin-top: 10px;
            opacity: 0.9;
        }
        /* ❌ BEZÁRÓ X */
.close-btn {
    position: fixed;
    top: 14px;
    right: 16px;
    color: white;
    text-decoration: none;
    font-size: 26px;
    font-weight: 600;
    z-index: 1000;
    opacity: 0.85;
}

.close-btn:hover {
    opacity: 1;
}

/* MOBIL */
@media (max-width: 768px) {
    .slider {
        height: 35vh;
        max-height: 300px;
    }

    .buttons {
        flex-direction: column;
        width: 100%;
        align-items: center;
    }

    .buttons a {
        width: 90%;
        font-size: 16px;
    }

    .close-btn {
        font-size: 28px;
        top: 12px;
        right: 14px;
    }
}
        a {
            color: yellow;
            font-size: 15px;
            text-align: center;
            text-decoration: none;
        }
        .center {
            text-align: center;
        }
    </style>
</head>

            <div class="card-location" style="text-align: justify;"> Olaszország ikonikus hangulata egy felejthetetlen estén kel életre, hiszen a legendás Sanremo Zenei Fesztivál – a Festival della canzone italiana – évtizedek óta a mediterrán életstílus és a magas színvonalú zene megtestesítője. 2026. augusztus 22-én ez az összetéveszthetetlen fesztiválhangulat Közép-Európa egyik legmodernebb helyszínére, az MVM Dómba költözik. Az este folyamán Olaszország legnagyobb slágerei csendülnek fel világszínvonalú előadásokban: két kiváló olasz zenekar idézi meg Adriano Celentano és Mina legnépszerűbb dalait, miközben színpadra lép a tehetséges Andrea Moricone és a karizmatikus Erox Martini is. Az est abszolút fénypontjaként pedig a világszerte ismert Ricchi & Poveri érkezése teszi teljessé ezt az emlékezetes zenei élményt.<br><br></div>
