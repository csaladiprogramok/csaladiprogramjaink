function createMonth(year, monthIndex, isCurrent) {
    const box = document.createElement("div");
    box.className = "month" + (isCurrent ? " current-box" : "");

    const h2 = document.createElement("h2");
    h2.innerText = `${year}. ${HONAPOK[monthIndex]}`;
    box.appendChild(h2);

    const weekdays = document.createElement("div");
    weekdays.className = "weekdays";
    HETNAPOK.forEach(n => {
        const w = document.createElement("div");
        w.className = "weekday";
        w.innerText = n;
        weekdays.appendChild(w);
    });
    box.appendChild(weekdays);

    const grid = document.createElement("div");
    grid.className = "days";

    const firstDay = new Date(year, monthIndex, 1);
    let start = firstDay.getDay();
    start = start === 0 ? 6 : start - 1;

    const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();

    for (let i = 0; i < start; i++) {
        const empty = document.createElement("div");
        empty.className = "day other-month";
        grid.appendChild(empty);
    }

    for (let d = 1; d <= daysInMonth; d++) {
        const day = document.createElement("div");
        day.className = "day";

        const key = `${year}-${String(monthIndex+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

        if (events[key]) {
            day.classList.add("event");
            day.onclick = () => openModal(events[key]);
        } else {
            day.classList.add("free");
        }

        if (
            now.getFullYear() === year &&
            now.getMonth() === monthIndex &&
            now.getDate() === d
        ) {
            day.classList.add("today");
        }

        day.innerText = d;
        grid.appendChild(day);
    }

    const total = start + daysInMonth;
    const endFill = (7 - total % 7) % 7;

    for (let i = 0; i < endFill; i++) {
        const empty = document.createElement("div");
        empty.className = "day other-month";
        grid.appendChild(empty);
    }

    box.appendChild(grid);
    return box;
}

function openModal(data) {
    modalTitle.innerText = data.title;
    modalDesc.innerText = data.desc;
    modalLink.href = data.link;

    if (data.location) {
        modalLocation.innerText = data.location;
        modalLocation.style.display = "block";
    } else {
        modalLocation.style.display = "none";
    }

    modal.style.display = "flex";
}

modal.onclick = e => {
    if (e.target === modal) modal.style.display = "none";
};

const cal = document.getElementById("calendar");
let baseYear = now.getFullYear();
let baseMonth = now.getMonth();

for (let i = 0; i < 12; i++) {
    const date = new Date(baseYear, baseMonth + i, 1);
    cal.appendChild(
        createMonth(
            date.getFullYear(),
            date.getMonth(),
            i === 0
        )
    );
}

function openLegend() {
    document.getElementById("legendModal").style.display = "flex";
}

document.getElementById("legendModal").onclick = e => {
    if (e.target.id === "legendModal") {
        e.target.style.display = "none";
    }
};


function closeLegend() {
    document.getElementById("legendModal").style.display = "none";
}

function openModal(data) {
    modalTitle.innerText = data.title;
    modalDesc.innerText = data.desc;

    const nowTime = new Date();
    let showLink = true;

    if (data.linkExpires) {
        const expireTime = new Date(data.linkExpires);
        if (nowTime >= expireTime) {
            showLink = false;
        }
    }

    if (showLink && data.link) {
        modalLink.href = data.link;
        modalLink.style.display = "inline-block";
    } else {
        modalLink.style.display = "none";
    }

    if (data.location) {
        modalLocation.innerText = data.location;
        modalLocation.style.display = "block";
    } else {
        modalLocation.style.display = "none";
    }

    modal.style.display = "flex";
}
function openModal(data) {
    modalTitle.innerText = data.title;
    modalDesc.innerText = data.desc;

    const nowTime = new Date();
    let expired = false;

    if (data.linkExpires) {
        const expireTime = new Date(data.linkExpires);
        if (nowTime >= expireTime) {
            expired = true;
        }
    }

    if (expired) {
        modalLink.style.display = "inline-block";
        modalLink.removeAttribute("href");
        modalLink.innerText = "A program véget ért!";
        modalLink.classList.add("expired-text");
    } else if (data.link) {
        modalLink.href = data.link;
        modalLink.innerText = "Részletek megtekintése";
        modalLink.style.display = "inline-block";
        modalLink.classList.remove("expired-text");
    } else {
        modalLink.style.display = "none";
    }

    if (data.location) {
        modalLocation.innerText = data.location;
        modalLocation.style.display = "block";
    } else {
        modalLocation.style.display = "none";
    }

    modal.style.display = "flex";
}
