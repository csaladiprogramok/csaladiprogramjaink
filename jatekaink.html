<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Játékaink</title>

    <style>
        body.locked {
            background: radial-gradient(circle at top, #0b2a4a, #000);
            ;
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at top, #0b2a4a, #000);
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at top, #0b2a4a, #000);
            z-index: -1;
        }

        /* ZÁROLT ÁLLAPOT */
        body.locked {
            overflow: hidden;
        }

        body.locked .tartalom,
        body.locked .close-btn,
        body.locked footer {
            display: none;
        }

        .tartalom {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: black
        }

        .close-btn {
            position: fixed;
            top: 14px;
            right: 16px;
            color: white;
            text-decoration: none;
            font-size: 26px;
            font-weight: 600;
            z-index: 1000;
            opacity: 0.85;
        }

        .close-btn:hover {
            opacity: 1;
        }

        .alcim {
            font-size: 0.95rem;
            color: #bbbbbb;
            margin-bottom: 15px;
        }

        /* MODAL */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .modal-box {
            background: linear-gradient(145deg, #0b2a4a, #000);
            padding: 30px 25px;
            border-radius: 20px;
            width: 300px;
            text-align: center;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.2);
        }

        /* ACCORDION */
        .accordion {
            background: #e6e6e6;
            border-radius: 10px;
            color: #000;
            margin-top: 30px;
            overflow: hidden;
        }

        .accordion-header {
            width: 100%;
            background: #d9d9d9;
            border: none;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            text-align: left;
        }

        .acc-text h3 {
            margin: 0;
            font-size: 1.2rem;
        }

        .acc-sub {
            font-size: 0.9rem;
            color: #444;
        }

        .acc-status {
            margin-top: 5px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .acc-arrow {
            font-size: 1.2rem;
            transition: transform 0.3s ease;
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            background: #f2f2f2;
            transition: max-height 0.35s ease;
            padding: 0 15px;
        }

        .accordion-content p {
            color: #000;
            font-size: 0.95rem;
            padding: 15px 0;
        }

        /* NYITOTT ÁLLAPOT */
        .accordion.active .accordion-content {
            max-height: 300px;
        }

        .accordion-content p {
            color: #000;
            font-size: 0.95rem;
            padding: 15px 0;
        }

        /* NYITOTT ÁLLAPOT */
        .accordion.active .accordion-content {
            max-height: 300px;
        }

        /* MOBILON SORKIZÁRT */
        @media (max-width: 768px) {
            .accordion-content p {
                text-align: justify;
                hyphens: auto;
                /* elválasztás */
                -webkit-hyphens: auto;
                -ms-hyphens: auto;
            }
        }

        .accordion.active .acc-arrow {
            transform: rotate(180deg);
        }

        #pinInput {
            width: 100%;
            padding: 12px;
            font-size: 22px;
            text-align: center;
            letter-spacing: 6px;
            border-radius: 10px;
            border: none;
            margin-bottom: 20px;
            background: #111;
            color: #0ff;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .keypad button {
            padding: 16px;
            font-size: 18px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
        }

        #pinError {
            color: #ff6666;
            margin-top: 12px;
            display: none;
        }

        a {
            text-decoration: none;
            color: blue;
        }

        footer {
            text-align: center;
            padding: 25px 0;
            color: #888;
            font-size: 0.9rem;
        }

        body {
            background-color: #f0f4f8;
            font-family: Arial, sans-serif;
        }

        /* Oldal széleitől beljebb */
.oldal-keret {
    max-width: 900px;
    margin: 5px auto 20px; /* felül kisebb */
    padding: 0 20px;
}

        .accordion {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        /* Fejléc */
        .accordion-fejlec {
            background: linear-gradient(135deg, #3a7bd5, #00d2ff);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .accordion-fejlec h3 {
            margin: 0;
        }

        .accordion-fejlec p {
            margin: 5px 0 0;
            font-size: 14px;
            opacity: 0.9;
        }

        .nyil {
            font-size: 22px;
            transition: transform 0.3s;
        }

        /* Tartalom */
        .accordion-tartalom {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
            padding: 0 20px;
        }

        .accordion-tartalom ul {
            padding-left: 20px;
        }

        .accordion-tartalom li {
            margin: 6px 0;
        }

        /* Letöltés gomb */
        .letoltes {
            display: inline-block;
            margin: 15px 0 20px;
            padding: 10px 16px;
            background-color: #3a7bd5;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .letoltes:hover {
            background-color: #2f65b0;
        }
        
/* ⏳ Időzített megjelenés – alapból rejtve */
[data-show-date] {
    display: none;
}
.segitseg-linkek {
    display: flex;
    flex-direction: column;   /* egymás alatt */

}

}

}

}

.segitseg-linkek img {

    max-width: 400px;         /* asztalin nem nő túl nagyra */
    height: auto;
    border-radius: 12px;      /* lekerekített sarkok */
    transition: 0.3s;
}

.segitseg-linkek img:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(0,0,0,0.3);
}
.a1 {
    color: black;
}

    </style>
</head>

<body>

    </div>

    <div class="oldal-keret">

 


        <div class="accordion">
            <div class="accordion-fejlec" onclick="valt(0)">
                <div>
                    <h3>A HÓNAP KÉRDÉSE</h3>
                    <p><strong><i>Játék</i></strong></p>

                <div>

                        VÁLASZLAPOK <br> HATÁROZATOK</p>
                </div>
                <div data-show-date="2026-03-01T00:00:00">
                    <p><strong>2026. MÁRCIUS</strong></p>
                    <a href="#">JÁTÉKTÉR</a> <br> BEKÜLDÖTT

                </div>


            </div>
        </div>

    </div>
</div>
    <script>

        function valt(index) {
            const tartalom = document.querySelectorAll(".accordion-tartalom")[index];
            const nyil = document.querySelectorAll(".nyil")[index];

            if (tartalom.style.maxHeight) {
                tartalom.style.maxHeight = null;
                nyil.style.transform = "rotate(0deg)";
            } else {
                tartalom.style.maxHeight = tartalom.scrollHeight + "px";
                nyil.style.transform = "rotate(180deg)";
            }
        }


    </script>
<script>
document.addEventListener("DOMContentLoaded", function () {

    const now = new Date();

    document.querySelectorAll("[data-show-date]").forEach(elem => {
        const showDate = new Date(elem.dataset.showDate);

        if (now >= showDate) {
            elem.style.display = "block";
        }
    });

});
</script>

</body>
